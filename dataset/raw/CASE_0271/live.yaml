kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: postgresql-dev
  namespace: postgresql-dev
  labels:
    app.kubernetes.io/instance: postgresql-dev
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/version: 18.6.0
    helm.sh/chart: postgresql-18.12.14
    app.kubernetes.io/component: primary
    environment: dev
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: postgresql-dev
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/component: primary
  policyTypes:
  - Ingress
  - Egress
  egress:
  - {}
  ingress:
  - ports:
    - port: 5432
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: api-gateway
