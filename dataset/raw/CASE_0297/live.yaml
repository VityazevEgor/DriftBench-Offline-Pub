  name: redis-dev-master
  namespace: redis-dev
  labels:
    app.kubernetes.io/instance: redis-dev
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: redis
    app.kubernetes.io/version: 8.10.3
    helm.sh/chart: redis-28.3.1
