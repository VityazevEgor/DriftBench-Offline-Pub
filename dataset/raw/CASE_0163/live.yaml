apiVersion: v1
kind: Service
metadata:
  name: postgresql-prod-hl
  namespace: postgresql-prod
  labels:
    app.kubernetes.io/instance: postgresql-prod
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/version: 18.6.0
    helm.sh/chart: postgresql-18.12.15
    app.kubernetes.io/component: primary
    environment: prod
  annotations: null
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
  - name: tcp-postgresql
    port: 5432
    targetPort: tcp-postgresql
  selector:
    app.kubernetes.io/instance: postgresql-prod-v2
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: primary
