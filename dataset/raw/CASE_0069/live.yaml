apiVersion: v1
kind: Service
metadata:
  name: nginx-prod
  namespace: nginx-prod
  labels:
    app.kubernetes.io/instance: nginx-prod
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: nginx
    app.kubernetes.io/version: 1.31.7
    helm.sh/chart: nginx-25.2.5
    environment: prod
  annotations: null
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  ports:
  - name: http
    port: 1080
    targetPort: http
  - name: https
    port: 443
    targetPort: https
  selector:
    app.kubernetes.io/instance: nginx-prod
    app.kubernetes.io/name: nginx
