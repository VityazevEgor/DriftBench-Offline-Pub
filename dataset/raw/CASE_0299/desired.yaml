apiVersion: v1
kind: Service
metadata:
  name: redis-dev-master
  namespace: redis-dev
  labels:
    app.kubernetes.io/instance: redis-dev
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: redis
    app.kubernetes.io/version: 8.10.2
    helm.sh/chart: redis-28.3.1
    app.kubernetes.io/component: master
    environment: dev
spec:
  type: ClusterIP
  internalTrafficPolicy: Cluster
  ports:
  - name: tcp-redis
    port: 6379
    targetPort: redis
    nodePort: null
  selector:
    app.kubernetes.io/instance: redis-dev
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: master
