kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: rabbitmq-dev
  namespace: rabbitmq-dev
  labels:
    app.kubernetes.io/instance: rabbitmq-dev
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/version: 4.1.3
    helm.sh/chart: rabbitmq-16.0.14
    environment: dev
    owner: team-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: rabbitmq-dev
      app.kubernetes.io/name: rabbitmq
  policyTypes:
  - Ingress
  - Egress
  egress:
  - {}
  ingress: []
