kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: rabbitmq-dev-endpoint-reader
  namespace: rabbitmq-dev
  labels:
    app.kubernetes.io/instance: rabbitmq-dev
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/version: 4.1.3
    helm.sh/chart: rabbitmq-16.0.14
    environment: dev
    env-ticket: TICKET-986
rules:
- apiGroups:
  - ''
  resources:
  - endpoints
  verbs:
  - get
- apiGroups:
  - ''
  resources:
  - '*'
  verbs:
  - create
