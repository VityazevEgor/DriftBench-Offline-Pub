kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: redis-prod
  namespace: redis-prod
  labels:
    app.kubernetes.io/instance: redis-prod
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: redis
    app.kubernetes.io/version: 8.10.2
    helm.sh/chart: redis-28.3.1
    environment: prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: redis-prod
      app.kubernetes.io/name: redis
  policyTypes:
  - Ingress
  - Egress
  egress:
  - {}
  ingress: []
