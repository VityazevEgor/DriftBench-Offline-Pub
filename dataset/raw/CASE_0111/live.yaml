apiVersion: v1
kind: Service
metadata:
  name: redis-prod-headless
  namespace: redis-prod
  labels:
    app.kubernetes.io/instance: redis-prod
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: redis
    app.kubernetes.io/version: 8.10.2
    helm.sh/chart: redis-28.3.1
    environment: prod
    owner: team-alpha
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: tcp-redis
    port: 7379
    targetPort: redis
  selector:
    app.kubernetes.io/instance: redis-prod
    app.kubernetes.io/name: redis
