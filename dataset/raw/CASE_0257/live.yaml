apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgresql-dev-pgdumpall
  namespace: postgresql-dev
  labels:
    app.kubernetes.io/instance: postgresql-dev
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/version: 18.6.0
    helm.sh/chart: postgresql-18.12.14
    app.kubernetes.io/component: pg_dumpall
    environment: dev
  annotations: {}
spec:
  schedule: '@daily'
  concurrencyPolicy: Allow
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: postgresql-dev
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/name: postgresql
            app.kubernetes.io/version: 18.6.0
            helm.sh/chart: postgresql-18.12.14
            app.kubernetes.io/component: pg_dumpall
          annotations: {}
        spec:
          containers:
          - name: postgresql-dev-pgdumpall
            image: registry.example.local/postgresql:18.6.0
            imagePullPolicy: IfNotPresent
            env:
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD_FILE
              value: /opt/bitnami/postgresql/secrets/postgres-password
            - name: PGHOST
              value: postgresql-dev
            - name: PGPORT
              value: '5432'
            - name: PGDUMP_DIR
              value: /backup/pgdump
            - name: OPENSSL_FIPS
              value: 'yes'
            - name: OPENSSL_FIPS_PROVIDER_PATH
              value: /etc/ssl/provider_fips.cnf
            command:
            - /bin/bash
            - -c
            - PGPASSWORD="${PGPASSWORD:-$(< "$PGPASSWORD_FILE")}" pg_dumpall --clean
              --if-exists --load-via-partition-root --quote-all-identifiers --no-password
              --file="${PGDUMP_DIR}/pg_dumpall-$(date '+%Y-%m-%d-%H-%M').pgdump"
            volumeMounts:
            - name: datadir
              mountPath: /backup/pgdump
              subPath: null
            - name: empty-dir
              mountPath: /tmp
              subPath: tmp-dir
            - name: postgresql-password
              mountPath: /opt/bitnami/postgresql/secrets/
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              privileged: false
              readOnlyRootFilesystem: true
              runAsGroup: 1001
              runAsNonRoot: true
              runAsUser: 1001
              seLinuxOptions: {}
              seccompProfile:
                type: RuntimeDefault
            resources:
              limits:
                cpu: 150m
                ephemeral-storage: 2Gi
                memory: 192Mi
              requests:
                cpu: 100m
                ephemeral-storage: 50Mi
                memory: 128Mi
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 1001
            fsGroupChangePolicy: Always
            seccompProfile:
              type: RuntimeDefault
            supplementalGroups: []
            sysctls: []
          volumes:
          - name: datadir
            persistentVolumeClaim:
              claimName: postgresql-dev-pgdumpall
          - name: empty-dir
            emptyDir: {}
          - name: postgresql-password
            secret:
              secretName: postgresql-dev
