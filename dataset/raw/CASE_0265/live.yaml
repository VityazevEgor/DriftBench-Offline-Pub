apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-prod
  namespace: nginx-prod
  labels:
    app.kubernetes.io/instance: nginx-prod
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: nginx
    app.kubernetes.io/version: 1.31.7
    helm.sh/chart: nginx-25.2.5
    environment: prod
  annotations:
    nginx.ingress.kubernetes.io/whitelist-source-range: 0.0.0.0/0
spec:
  rules:
  - host: nginx.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx-prod
            port:
              name: http
