kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: nginx-dev
  namespace: nginx-dev
  labels:
    app.kubernetes.io/instance: nginx-dev
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: nginx
    app.kubernetes.io/version: 1.31.7
    helm.sh/chart: nginx-25.2.5
    environment: dev
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: nginx-dev
      app.kubernetes.io/name: nginx
  policyTypes:
  - Ingress
  - Egress
  egress:
  - {}
  ingress:
  - ports:
    - port: 8080
    - port: 8443
